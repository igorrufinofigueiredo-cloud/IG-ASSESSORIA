# Gera a base de prospecção da IG Assessoria a partir dos dados abertos do CNPJ (Receita Federal).
# Roda sozinho todo mês (a Receita publica o mês novo por volta do dia 15) e pode ser disparado à mão.
# Os arquivos saem cifrados num release; só o CRM tem a chave para abrir.
name: Base da Receita

on:
  schedule:
    - cron: "0 9 18 * *"   # dia 18, 06:00 em Brasília
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês AAAA-MM (vazio = o mais recente)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: base-receita
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==44.0.2
      - name: Processar a base
        env:
          GH_TOKEN: ${{ github.token }}
          MES_ARG: ${{ github.event.inputs.mes && format('--mes {0}', github.event.inputs.mes) || '' }}
        run: |
          # O andamento vai para a issue 1 a cada 2 minutos (dá para acompanhar sem abrir o log).
          set +e   # erro do script não pode pular o aviso final na issue
          python -u scripts/processar_receita.py --saida saida $MES_ARG > log.txt 2>&1 &
          PID=$!
          atualizar() { gh api -X PATCH "repos/${{ github.repository }}/issues/1" -f body="$(printf '%s\n\n```\n%s\n```' "$1" "$(tail -n 40 log.txt)")" > /dev/null || true; }
          while kill -0 $PID 2>/dev/null; do atualizar "Rodando desde $(date -u -d @$(stat -c %W log.txt) +%H:%M) UTC"; sleep 120; done
          wait $PID; CODE=$?
          if [ $CODE -eq 0 ]; then atualizar "Terminou bem em $(date -u +%F\ %H:%M) UTC"; else atualizar "Falhou (código $CODE) em $(date -u +%F\ %H:%M) UTC"; fi
          cat log.txt
          exit $CODE
      # A base vai como artefato: se a publicação falhar, dá para refazer só o job "publicar" sem baixar tudo de novo.
      - uses: actions/upload-artifact@v4
        with:
          name: saida
          path: saida
          retention-days: 5
          compression-level: 0

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: saida
          path: saida
      - name: Publicar nos releases do mês
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -u scripts/publicar.py saida > pub.txt 2>&1
          CODE=$?
          if [ $CODE -eq 0 ]; then T="Base publicada em $(date -u +%F\ %H:%M) UTC"; else T="Publicação falhou (código $CODE) em $(date -u +%F\ %H:%M) UTC"; fi
          gh api -X PATCH "repos/${{ github.repository }}/issues/1" -f body="$(printf '%s\n\n```\n%s\n```' "$T" "$(tail -n 40 pub.txt)")" > /dev/null || true
          cat pub.txt
          exit $CODE
