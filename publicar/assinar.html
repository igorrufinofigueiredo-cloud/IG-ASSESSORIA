<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050505">
<title>Contrato · IG Assessoria</title>
<link rel="icon" href="/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--preto:#050505;--tinta:#111;--apoio:#5c5c5c;--fraco:#8a8a8a;--linha:#e2e2e2;--fundo:#f6f6f4;--branco:#fff}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tinta);background:var(--fundo);padding-bottom:96px}
h1,h2,h3,.marca{font-family:Archivo,Inter,sans-serif}
.topo{background:var(--preto);color:#fff;padding:18px 20px}
.topo-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.topo img{height:30px;width:auto}
.marca{font-size:12px;letter-spacing:.32em;text-transform:uppercase;font-weight:600}
.marca small{display:block;font:400 11px/1.3 Inter,sans-serif;letter-spacing:.02em;text-transform:none;color:#9a9a9a;margin-top:2px}
main{max-width:820px;margin:0 auto;padding:24px 20px 40px}
.estado{border:1px solid var(--tinta);background:var(--branco);padding:14px 16px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start}
.estado b{display:block;font-family:Archivo,Inter,sans-serif;font-size:16px}
.estado p{color:var(--apoio);font-size:14px}
.estado .ponto{width:10px;height:10px;border-radius:50%;background:var(--tinta);margin-top:7px;flex:none}
.estado.ok .ponto{background:#fff;border:2px solid var(--tinta)}
.teste{border:1px dashed var(--apoio);color:var(--apoio);font-size:13px;padding:8px 12px;margin-bottom:14px;background:var(--branco)}
.folha{background:var(--branco);border:1px solid var(--linha);padding:28px 26px}
.folha h1{font-size:22px;line-height:1.25;margin-bottom:6px}
.sub{color:var(--apoio);font-size:13px;margin-bottom:20px}
.rot{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fraco);margin:22px 0 8px}
table.quadro{width:100%;border-collapse:collapse}
.quadro th,.quadro td{padding:9px 0;border-bottom:1px solid var(--linha);text-align:left;vertical-align:top;font-size:14px}
.quadro th{font-weight:400;color:var(--apoio);width:42%;padding-right:12px}
.quadro td{text-align:right}
.quadro tr.total th{color:var(--tinta);font-weight:600;border-top:1.5px solid var(--tinta);border-bottom:none}
.quadro tr.total td{font:700 20px/1.2 Archivo,Inter,sans-serif;border-top:1.5px solid var(--tinta);border-bottom:none}
.partes p{font-size:14px;margin-bottom:8px}
.cl{border-top:1px solid var(--linha);padding:16px 0 4px}
.cl h3{font-size:15.5px;display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.cl h3 span{font:500 12px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--fraco);min-width:22px}
.cl p{font-size:14.5px;margin-bottom:8px;text-align:justify;hyphens:auto}
.bloco{border:1px solid var(--linha);background:#fafafa;padding:12px 14px;margin:6px 0 10px}
.bloco h4{font-size:14.5px;margin-bottom:6px}
.bloco ul{padding-left:18px}
.bloco li{font-size:14px;margin:3px 0}
.bloco .fora{color:var(--apoio)}
.bloco .fr{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fraco);margin:10px 0 2px}
table.etapas{width:100%;border-collapse:collapse;margin:4px 0 10px}
.etapas td{border-bottom:1px solid var(--linha);padding:7px 4px;font-size:14px}
.etapas td:first-child{width:28px;color:var(--fraco)}
.etapas td:last-child{text-align:right;white-space:nowrap;color:var(--apoio)}
.ass{margin-top:18px}
.ass-i{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--linha);font-size:14px}
.ass-i span:last-child{color:var(--apoio);text-align:right}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.bt{appearance:none;border:1.5px solid var(--tinta);background:var(--branco);color:var(--tinta);font:600 15px/1 Inter,sans-serif;padding:15px 20px;min-height:50px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.bt.forte{background:var(--preto);color:#fff;border-color:var(--preto)}
.bt[disabled]{opacity:.5;cursor:default}
.barra{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--linha);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;z-index:5}
.barra .in{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:center}
.barra .bt{flex:1}
.barra small{flex:1.2;color:var(--apoio);font-size:12.5px;line-height:1.35}
.nota{font-size:12.5px;color:var(--apoio);margin-top:18px;line-height:1.55}
.hash{font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--fraco);word-break:break-all;margin-top:6px}
.carregando{padding:60px 0;text-align:center;color:var(--apoio)}
.msg{font-size:13px;color:var(--apoio);margin-top:10px;min-height:1em}
#nl-badge-frame{display:none!important}
@media (max-width:560px){.folha{padding:22px 16px;border-left:none;border-right:none}main{padding:16px 0 32px}.estado,.teste{margin-left:16px;margin-right:16px}.folha h1{font-size:20px}.quadro th{width:46%}}
@media print{.topo,.barra,.acoes,.estado,.teste,.nota{display:none!important}body{background:#fff;padding:0}.folha{border:none;padding:0}}
</style>
</head>
<body>
<header class="topo"><div class="topo-in"><img src="/logo-ig.png" alt="IG Assessoria"><div class="marca">Assessoria<small>marca, sites e sistemas</small></div></div></header>
<main id="app"><p class="carregando">Carregando o contrato...</p></main>
<div class="barra" id="barra"><div class="in"><small id="barra-txt"></small><button class="bt forte" id="barra-bt" type="button">Assinar eletronicamente</button></div></div>
<script>
(function(){
'use strict';
var FN = 'https://mkgmvupvmadvrtoqrycz.supabase.co/functions/v1/contrato-portal';
var token = new URLSearchParams(location.search).get('c') || '';
var app = document.getElementById('app'), dados = null;

function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dt(iso, hora){ if(!iso) return ''; var d = new Date(iso); return hora ? d.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : d.toLocaleDateString('pt-BR'); }
function chamar(corpo){
  return fetch(FN, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({t: token}, corpo || {}))})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) throw new Error(j.erro || 'Não foi possível abrir o contrato agora.'); return j; }); });
}
function erro(t){
  app.innerHTML = '<div class="estado"><span class="ponto"></span><div><b>Contrato indisponível</b><p>' + esc(t) + '</p><p>Se precisar, fale com a IG Assessoria pelo WhatsApp (83) 9624-3847.</p></div></div>';
}
var ESTADO = {
  aguardando: ['Aguardando a sua assinatura', 'Leia o contrato com calma. Quando estiver tudo certo, toque em Assinar eletronicamente.'],
  parcial: ['Assinatura em andamento', 'Uma das partes já assinou.'],
  assinado: ['Contrato assinado', 'Todas as assinaturas foram concluídas. Você pode baixar a via assinada com o relatório de assinaturas.'],
  encerrado: ['Contrato encerrado', 'Este contrato foi assinado e depois encerrado. A via assinada continua disponível.'],
  recusado: ['Assinatura recusada', 'Este contrato foi recusado na plataforma de assinatura. Fale com a IG Assessoria para uma nova versão.'],
  expirado: ['Prazo de assinatura vencido', 'O prazo para assinar este link venceu. Peça um link novo à IG Assessoria.'],
  cancelado: ['Contrato cancelado', 'Este contrato foi cancelado pela IG Assessoria.']
};
function montar(d){
  dados = d;
  var c = d.contrato || {}, doc = c.documento || {}, st = d.status;
  var e = ESTADO[st] || ['Contrato', ''];
  if(st === 'parcial') e = ['Assinatura em andamento', d.pode_assinar ? 'A IG Assessoria já assinou. Falta a sua assinatura.' : 'Você já assinou. Falta a assinatura da IG Assessoria.'];
  if(st === 'aguardando' && d.aguardando_ig) e = ['Aguardando a IG Assessoria', 'Neste contrato a IG assina primeiro. Assim que ela assinar, a sua assinatura fica liberada aqui.'];
  var h = '';
  if(d.teste) h += '<div class="teste">Contrato de teste: sem validade jurídica.</div>';
  h += '<div class="estado' + (st === 'assinado' ? ' ok' : '') + '"><span class="ponto"></span><div><b>' + esc(e[0]) + '</b><p>' + esc(e[1])
    + ((st === 'aguardando' || st === 'parcial') && d.expira_em ? ' O link vale até ' + esc(dt(d.expira_em, true)) + '.' : '') + '</p></div></div>';
  h += '<article class="folha"><h1>' + esc(doc.titulo || 'Contrato de prestação de serviços') + '</h1><p class="sub">Versão ' + esc(d.versao || 1) + (d.enviado_em ? ' · enviado em ' + esc(dt(d.enviado_em)) : '') + '</p>';
  var q = doc.quadro || [], tot = q.filter(function(l){ return l[2] === 'total'; }), rest = q.filter(function(l){ return l[2] !== 'total'; });
  h += '<div class="rot">Resumo</div><table class="quadro">' + rest.concat(tot).map(function(l){ return '<tr' + (l[2] === 'total' ? ' class="total"' : '') + '><th>' + esc(l[0]) + '</th><td>' + esc(l[1]) + '</td></tr>'; }).join('') + '</table>';
  h += '<div class="rot">Partes</div><div class="partes">' + (doc.partes || []).map(function(t){ return '<p>' + esc(t) + '</p>'; }).join('') + '</div>';
  h += '<div class="rot">Cláusulas</div>';
  (doc.secoes || []).forEach(function(s){
    h += '<section class="cl"><h3><span>' + esc(String(s.n).padStart(2, '0')) + '</span>' + esc(s.titulo) + '</h3>';
    (s.p || []).forEach(function(t){ h += '<p>' + esc(t) + '</p>'; });
    (s.blocos || []).forEach(function(b){
      h += '<div class="bloco"><h4>' + esc(b.titulo) + '</h4><ul>' + (b.itens || []).map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
      if(b.fora && b.fora.length) h += '<div class="fr">Não incluído</div><ul class="fora">' + b.fora.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
      h += '</div>';
    });
    if(s.etapas && s.etapas.length) h += '<table class="etapas">' + s.etapas.map(function(x, i){ return '<tr><td>' + (i + 1) + '</td><td>' + esc(x[0]) + '</td><td>' + esc(x[1]) + (Number(x[1]) === 1 ? ' dia útil' : ' dias úteis') + '</td></tr>'; }).join('') + '</table>';
    h += '</section>';
  });
  var rot = {pendente:'Pendente', assinado:'Assinou', recusado:'Recusou'};
  h += '<div class="rot">Assinaturas</div><div class="ass">' + (d.assinaturas || []).map(function(a){
    return '<div class="ass-i"><span>' + (a.papel === 'ig' ? 'Contratada: IG Assessoria' : 'Contratante: ' + esc(a.nome)) + '</span><span>' + (rot[a.status] || esc(a.status)) + (a.assinado_em ? ' em ' + esc(dt(a.assinado_em, true)) : '') + '</span></div>';
  }).join('') + '</div>';
  h += '<div class="acoes">';
  if(d.pode_assinar) h += '<button class="bt forte" type="button" data-a="assinar">Assinar eletronicamente</button>';
  if(d.tem_pdf_assinado) h += '<button class="bt forte" type="button" data-a="pdf-assinado">Baixar PDF assinado</button>';
  if(d.tem_pdf) h += '<button class="bt" type="button" data-a="pdf">Baixar PDF do contrato</button>';
  h += '</div><p class="msg" id="msg" role="status"></p>';
  h += '<p class="nota">A assinatura é feita na plataforma Autentique, com validade jurídica, e registra nome, CPF, data, hora e endereço de internet de quem assina. Para comprovar o processo, esta página também registra quando o link é aberto, o endereço de internet e o navegador usado. Esses dados servem só a este contrato, conforme a Lei nº 13.709/2018 (LGPD).</p>';
  if(d.hash_pdf) h += '<p class="hash">Código SHA-256 do PDF desta versão: ' + esc(d.hash_pdf) + '</p>';
  if(d.hash_pdf_assinado) h += '<p class="hash">Código SHA-256 do PDF assinado: ' + esc(d.hash_pdf_assinado) + '</p>';
  h += '</article>';
  app.innerHTML = h;
  var barra = document.getElementById('barra');
  barra.style.display = d.pode_assinar ? 'block' : 'none';
  document.getElementById('barra-txt').textContent = d.expira_em ? 'Assine até ' + dt(d.expira_em) : 'Assinatura eletrônica';
}
function msg(t){ var m = document.getElementById('msg'); if(m) m.textContent = t || ''; }
function acao(a, bt){
  if(bt) bt.disabled = true;
  var janela = window.open('', '_blank');
  var corpo = a === 'assinar' ? {acao:'assinar'} : {acao:'pdf', tipo: a === 'pdf-assinado' ? 'assinado' : 'original'};
  msg(a === 'assinar' ? 'Abrindo a assinatura...' : 'Preparando o arquivo...');
  chamar(corpo).then(function(j){
    msg(a === 'assinar' ? 'A assinatura abriu em outra aba. Depois de assinar, volte aqui e atualize a página.' : '');
    if(janela) janela.location = j.url; else location.href = j.url;
  }).catch(function(err){ if(janela) janela.close(); msg(err.message); })
    .then(function(){ if(bt) bt.disabled = false; });
}
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-a]'); if(b) return acao(b.getAttribute('data-a'), b);
  if(ev.target.id === 'barra-bt') acao('assinar', ev.target);
});
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && dados && (dados.status === 'aguardando' || dados.status === 'parcial')) chamar({}).then(montar).catch(function(){});
});
if(!/^[A-Za-z0-9_-]{20,80}$/.test(token)) erro('O link está incompleto. Confira se copiou o endereço inteiro.');
else chamar({}).then(montar).catch(function(e){ erro(e.message); });
})();
</script>
</body>
</html>
